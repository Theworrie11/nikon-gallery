name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: flutter create --org com.example --platforms android nikon_gallery

      - name: Add packages
        working-directory: nikon_gallery
        run: flutter pub add gal path_provider

      - name: Copy app code
        run: |
          cp app_files/main.dart nikon_gallery/lib/main.dart
          cp app_files/ptpip.dart nikon_gallery/lib/ptpip.dart
          cp app_files/MainActivity.kt nikon_gallery/android/app/src/main/kotlin/com/example/nikon_gallery/MainActivity.kt

      - name: Add Android permissions
        run: |
          M=nikon_gallery/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <application|' "$M"

      - name: Build APK
        working-directory: nikon_gallery
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: nikon-gallery-apk
          path: nikon_gallery/build/app/outputs/flutter-apk/app-release.apk
